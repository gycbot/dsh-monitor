<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#0c1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>dsh 监控</title>
<style>
:root {
  --bg:#0c1117; --card:#161d27; --fg:#eef3f8; --mut:#8b9bab;
  --acc:#4aa3f0; --err:#f07178; --ok:#7fd99a; --warn:#e6c07b;
  --think:#1a2433; --think-line:#6c8cff; --line:#2a3544;
  --tap:48px; --header:56px; --radius:12px;
  --pad: max(16px, env(safe-area-inset-left));
  --padr: max(16px, env(safe-area-inset-right));
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
  font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x:hidden; max-width:100%; min-height:100%; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
a { color:var(--acc); }

/* ---- lock ---- */
#lock { min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
#lock form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:28px 22px 22px; }
#lock h1 { margin:0 0 6px; font-size:1.25rem; font-weight:650; }
#lock p { margin:0 0 18px; color:var(--mut); font-size:15px; }
#lock label { display:block; margin-bottom:8px; color:var(--mut); font-size:15px; }
#lock input { width:100%; height:var(--tap); padding:0 14px; border-radius:10px;
  border:1px solid var(--line); background:#0c1117; color:var(--fg); font-size:16px; }
#lock button { width:100%; height:var(--tap); margin-top:14px; border:0; border-radius:10px;
  background:var(--acc); color:#071018; font-weight:700; font-size:16px; }
#lock input:focus, #lock button:focus { outline:2px solid var(--acc); outline-offset:2px; }

/* ---- app ---- */
#app { display:none; min-height:100dvh; }
#app.open { display:block; }
body.unlocked #lock { display:none; }
body.unlocked #app { display:block; }

header.top { position:sticky; top:0; z-index:20; background:rgba(12,17,23,.94);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding: env(safe-area-inset-top) 0 0; }
.hbar { display:flex; align-items:center; gap:8px;
  padding:6px var(--padr) 6px var(--pad); min-height:var(--header); }
.hbar h1 { flex:1; margin:0; font-size:17px; font-weight:650; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; min-width:0; }
.iconbtn { flex:none; min-width:var(--tap); height:var(--tap); border:0; border-radius:10px;
  background:transparent; color:var(--fg); font-size:20px; display:inline-flex;
  align-items:center; justify-content:center; }
.iconbtn[hidden] { display:none; }
.subbar { padding:0 var(--padr) 8px var(--pad); color:var(--mut); font-size:15px;
  display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
.subbar .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; }
.subbar .dot.off { background:var(--mut); }
.subbar .dot.err { background:var(--err); }
.searchwrap { padding:0 var(--padr) 8px var(--pad); }
.searchwrap input, .switcher { width:100%; height:40px; border-radius:10px; border:1px solid var(--line);
  background:#0c1117; padding:0 12px; font-size:16px; }
.filters { display:flex; gap:8px; overflow-x:auto; padding:0 var(--padr) 10px var(--pad);
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.filters::-webkit-scrollbar { display:none; }
.chip { flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--fg); font-size:15px; }
.chip.on { background:#1e3a5f; border-color:var(--acc); color:#d6ecff; }

main { padding: 8px var(--padr) 48px var(--pad); max-width:100%; }

.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 14px; margin:0 0 10px; width:100%; text-align:left; display:block; color:inherit; }
button.card { min-height:var(--tap); }
.card h2, .t-title { margin:0 0 4px; font-size:16px; font-weight:650; word-break:break-word; }
.meta { color:var(--mut); font-size:15px; word-break:break-word; }
.pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.pill { display:inline-block; font-size:13px; line-height:1; padding:6px 8px; border-radius:999px;
  background:#243044; color:#c5d4e4; }
.pill.ok { background:#163323; color:var(--ok); }
.pill.run { background:#1e3a5f; color:#9cc7f5; }
.pill.err { background:#3a1a1d; color:var(--err); }
.pill.warn { background:#3a3218; color:var(--warn); }

.step { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin:0 0 10px; overflow:hidden; }
.step > button.head { width:100%; min-height:var(--tap); text-align:left; border:0; background:transparent;
  padding:12px 14px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
.step > button.head .n { font-weight:700; }
.step > button.head .t { color:var(--mut); font-size:15px; }
.step .body { display:none; padding:0 14px 14px; border-top:1px solid var(--line); }
.step.open .body { display:block; }
.block { margin-top:12px; }
.block h3 { margin:0 0 6px; font-size:15px; color:var(--mut); font-weight:650; }
.think { background:var(--think); border-left:3px solid var(--think-line); border-radius:0 8px 8px 0;
  padding:10px 12px; white-space:pre-wrap; word-break:break-word; font-size:15px; }
.msg { white-space:pre-wrap; word-break:break-word; }
.tool { margin-top:10px; background:#121820; border:1px solid var(--line); border-radius:8px; padding:10px; }
.tool .tn { font-weight:650; font-size:15px; }
.scrollbox, pre.scrollbox { display:block; margin:8px 0 0; max-width:100%; max-height:240px;
  overflow:auto; overflow-wrap:anywhere; white-space:pre-wrap; word-break:break-word;
  background:#0c1117; border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.45;
  border:1px solid var(--line); }
.err { color:var(--err); white-space:pre-wrap; word-break:break-word; }
.morebtn { margin-top:6px; height:36px; padding:0 10px; border:1px solid var(--line);
  border-radius:8px; background:transparent; color:var(--acc); font-size:15px; }
.turnh { margin:18px 0 8px; font-size:15px; color:var(--mut); font-weight:700; }
article.step, .turnh { scroll-margin-top: 150px; }
.empty { color:var(--mut); padding:24px 8px; text-align:center; }
.hidden { display:none !important; }

/* desktop: sidebar + detail */
@media (min-width: 900px) {
  #app.desk { display:block; }
  #app.desk #cols { display:grid; grid-template-columns: 360px 1fr; align-items:start;
    min-height: calc(100dvh - 148px); }
  #app.desk #listcol { border-right:1px solid var(--line); overflow:auto;
    max-height:calc(100dvh - 148px); padding:8px 12px 40px; }
  #app.desk #detailcol { overflow:auto; padding:8px 28px 60px;
    max-height:calc(100dvh - 148px); }
  #app.desk #detailPlaceholder { display:flex; }
  .switcher { display:none; }
}
@media (max-width: 899px) {
  #listcol, #detailcol { padding: 0; }
  #app.mob-detail #listcol { display:none; }
  #app.mob-list #detailcol { display:none; }
  #app.mob-list .switcher { display:none; }
  #detailPlaceholder { display:none; }
}
#detailPlaceholder { color:var(--mut); align-items:center; justify-content:center; min-height:40vh; }
</style>
</head>
<body>
<div id="lock">
  <form id="f" method="post" action="#" autocomplete="off">
    <h1>dsh 监控</h1>
    <p>输入密码查看任务与思考过程。密码只记在本次浏览会话里。</p>
    <label for="p">访问密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required autofocus/>
    <button type="submit">打开</button>
  </form>
</div>
<div id="app" class="mob-list">
  <header class="top">
    <div class="hbar">
      <button class="iconbtn" id="backBtn" hidden aria-label="返回列表">←</button>
      <h1 id="hdrTitle">dsh 监控</h1>
      <select id="switcher" class="switcher" aria-label="切换任务" style="flex:0 1 42%; max-width:46%; height:40px;"></select>
    </div>
    <div class="subbar" id="subbar"></div>
    <div class="searchwrap"><input id="q" type="search" placeholder="搜索任务、思考或工具" enterkeyhint="search"/></div>
    <div class="filters" id="filters">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="run">进行中</button>
      <button class="chip" data-f="done">已结束</button>
      <button class="chip" data-f="err">出错</button>
    </div>
  </header>
  <div id="cols">
    <div id="listcol"><main id="list"></main></div>
    <div id="detailcol">
      <div id="detailPlaceholder" class="empty">从左侧选一个任务，查看完整步骤和思考过程。</div>
      <div id="detail" class="hidden"></div>
    </div>
  </div>
</div>
<script>
const MANIFEST_URL = "data/manifest.enc.json?v=6dd1666e200f";
const SSKEY = "dshMonitor.pw";
const PREVIEW = 4096;
let manifest = null;
let key = null;
let salt = null;
let iters = 210000;
let currentId = null;
const chunkCache = new Map();
let filter = "all";
let query = "";

function b64(s) {
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function derive(pw, saltU8, n) {
  const enc = new TextEncoder();
  const mat = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:saltU8, iterations:n, hash:"SHA-256"},
    mat, {name:"AES-GCM", length:256}, false, ["decrypt"]
  );
}
async function decBlob(obj, k) {
  const iv = b64(obj.iv);
  const ct = b64(obj.ct);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, k, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function statusPill(st) {
  const s = String(st || "");
  let cls = "pill";
  if (/err|fail|error|失败|出错/i.test(s)) cls += " err";
  else if (/run|claim|active|进行|running/i.test(s)) cls += " run";
  else if (/ok|done|end|完成|结束|stop/i.test(s)) cls += " ok";
  else cls += " warn";
  return `<span class="${cls}">${esc(s || "未知")}</span>`;
}
function isRun(st) { return /run|claim|active|进行|running/i.test(String(st||"")); }
function isErr(st, err) { return !!(err) || /err|fail|error|失败|出错/i.test(String(st||"")); }
function isDone(st) { return /ok|done|end|完成|结束|stop/i.test(String(st||"")) && !isRun(st); }

function applyLayout() {
  const app = document.getElementById("app");
  const desk = window.matchMedia("(min-width:900px)").matches;
  app.classList.toggle("desk", desk);
  app.classList.toggle("mob-detail", !desk && !!currentId);
  app.classList.toggle("mob-list", !desk && !currentId);
  document.getElementById("backBtn").hidden = desk || !currentId;
}

async function unlock(pw) {
  const resp = await fetch(MANIFEST_URL, {cache:"no-store"});
  if (!resp.ok) throw new Error("manifest");
  const blob = await resp.json();
  salt = b64(blob.salt);
  iters = blob.iters || 210000;
  key = await derive(pw, salt, iters);
  manifest = await decBlob(blob, key);
  try { sessionStorage.setItem(SSKEY, pw); } catch (e) {}
  document.body.classList.add("unlocked");
  document.getElementById("p").value = "";
  renderChrome();
  renderList();
  const hash = (location.hash || "").replace(/^#\/?/, "");
  if (hash) openTask(hash);
  applyLayout();
}

function renderChrome() {
  const m = manifest || {};
  const proc = m.processes || {};
  const n = (m.tasks || []).length;
  const running = proc.dsh_headless ? "headless 在跑" : "headless 未跑";
  document.getElementById("subbar").innerHTML =
    `<span class="dot ${proc.dsh_headless ? "" : "off"}"></span>` +
    `<span>同步于 ${esc(m.generated_at || "")}（Asia/Shanghai）</span>` +
    `<span>${esc(running)}</span><span>${n} 个任务</span>`;
  const sel = document.getElementById("switcher");
  const opts = [`<option value="">任务列表</option>`].concat(
    (m.tasks || []).map(t => `<option value="${esc(t.id)}">${esc(t.title || t.short_id || t.id)}</option>`)
  );
  sel.innerHTML = opts.join("");
  sel.value = currentId || "";
}

function taskMatch(t) {
  if (filter === "run" && !isRun(t.status)) return false;
  if (filter === "done" && !isDone(t.status)) return false;
  if (filter === "err" && !isErr(t.status, t.error)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  const bag = [t.title, t.topic, t.short_id, t.session_id, t.workspace, t.model, t.status, t.error].join(" ").toLowerCase();
  return bag.includes(q);
}

function renderList() {
  const tasks = (manifest.tasks || []).filter(taskMatch);
  const el = document.getElementById("list");
  if (!tasks.length) { el.innerHTML = `<div class="empty">没有匹配的任务</div>`; return; }
  el.innerHTML = tasks.map(t => {
    const bits = [
      t.updated_at || "",
      t.model || "",
      (t.steps != null ? t.steps + " 步" : ""),
      ((t.tokens_in || t.tokens_out) ? `token ${t.tokens_in || 0}/${t.tokens_out || 0}` : ""),
      t.short_id || ""
    ].filter(Boolean).join(" · ");
    return `<button class="card" data-id="${esc(t.id)}">
      <div class="t-title">${esc(t.title || t.topic || t.short_id || t.id)} ${statusPill(t.status)}</div>
      <div class="meta">${esc(t.topic && t.topic !== t.title ? t.topic : (t.workspace || ""))}</div>
      <div class="meta">${esc(bits)}</div>
      ${t.error ? `<div class="err">${esc(t.error)}</div>` : ""}
    </button>`;
  }).join("");
  if (manifest.autoloop_chunk) {
    el.insertAdjacentHTML("beforeend", `<button class="card" data-id="autoloop">
      <div class="t-title">Autoloop 调度与卡片 ${statusPill((manifest.autoloop_summary||{}).state || "记录")}</div>
      <div class="meta">事件、卡片、worker 运行日志</div>
    </button>`);
  }
}

async function loadChunk(id) {
  if (chunkCache.has(id)) return chunkCache.get(id);
  const t = (manifest.tasks || []).find(x => x.id === id);
  const path = id === "autoloop" ? (manifest.autoloop_chunk || "data/autoloop.enc.json") : (t && t.chunk);
  if (!path) throw new Error("no chunk");
  const resp = await fetch(path + (path.includes("?") ? "&" : "?") + "v=" + encodeURIComponent(t && t.digest || id), {cache:"no-store"});
  if (!resp.ok) throw new Error("chunk");
  const blob = await resp.json();
  const data = await decBlob(blob, key);
  chunkCache.set(id, data);
  return data;
}

function clipView(obj, idBase) {
  if (!obj) return "";
  const text = typeof obj === "string" ? obj : (obj.text || "");
  const orig = (typeof obj === "object" && obj.orig_len) || text.length;
  const stored = text;
  const shownId = idBase;
  const need = stored.length > PREVIEW;
  const first = need ? stored.slice(0, PREVIEW) : stored;
  const extra = need ? stored.slice(PREVIEW) : "";
  const note = (typeof obj === "object" && obj.clipped) ? `（原长 ${orig} 字，已截到 ${stored.length} 字）` : (need ? `（共 ${stored.length} 字）` : "");
  return `<pre class="scrollbox" id="${shownId}">${esc(first)}</pre>` +
    (need ? `<button class="morebtn" data-more="${shownId}" data-extra="${encodeURIComponent(extra)}">显示全部${esc(note)}</button>` : "");
}

function renderStep(st, idx, tid, forceOpen) {
  const tools = st.tools || [];
  const think = (st.thinking || []).join("\n\n") || st.thinking_text || "";
  const thinkObj = st.thinking_obj || (think ? {text: think, orig_len: think.length} : null);
  const hasThink = !!(thinkObj && (thinkObj.text || think));
  const title = `第 ${st.step ?? idx} 步`;
  const meta = [st.time || "", (st.usage && (st.usage.in || st.usage.out)) ? `token ${st.usage.in||0}/${st.usage.out||0}` : "", tools.length ? `工具 ${tools.length}` : "", st.finish || ""].filter(Boolean).join(" · ");
  const toolsHtml = tools.map((c,i) => {
    const args = clipView(c.args, `${tid}-s${idx}-a${i}`);
    const res = clipView(c.result, `${tid}-s${idx}-r${i}`);
    return `<div class="tool"><div class="tn">${esc(c.name || "tool")} ${c.is_error ? '<span class="pill err">错误</span>' : ""}</div>
      ${c.time ? `<div class="meta">${esc(c.time)}</div>` : ""}
      ${args ? `<div class="block"><h3>参数</h3>${args}</div>` : ""}
      ${res ? `<div class="block"><h3>结果</h3>${res}</div>` : ""}</div>`;
  }).join("");
  const qhit = query && JSON.stringify(st).toLowerCase().includes(query.toLowerCase());
  return `<article class="step ${qhit || forceOpen ? "open":""}" data-step="${idx}">
    <button class="head" type="button"><span class="n">${esc(title)}</span><span class="t">${esc(meta)}</span>${hasThink ? '<span class="pill">有思考</span>' : ""}</button>
    <div class="body">
      ${hasThink ? `<div class="block"><h3>思考过程</h3><div class="think">${esc((thinkObj.text || think))}</div></div>` : ""}
      ${st.text ? `<div class="block"><h3>回复</h3><div class="msg">${esc(st.text)}</div></div>` : ""}
      ${st.error ? `<div class="block err">错误：${esc(st.error)}</div>` : ""}
      ${toolsHtml}
    </div>
  </article>`;
}

function renderSession(data) {
  const q = query.toLowerCase();
  let html = `<section class="card">
    <h2>${esc(data.title || data.short_id || data.id)} ${statusPill(data.status)}</h2>
    <div class="meta">会话 <span class="mono">${esc(data.session_id || data.id)}</span></div>
    <div class="meta">${esc([data.workspace, data.model, data.lane].filter(Boolean).join(" · "))}</div>
    <div class="meta">更新 ${esc(data.updated_at || "")} · 创建 ${esc(data.created_at || "")}</div>
    <div class="pills">${statusPill(data.finish || data.status)}
      <span class="pill">${esc((data.totals && data.totals.steps) || data.steps || 0)} 步</span>
      <span class="pill">token ${esc((data.totals && data.totals.tokens_in) || data.tokens_in || 0)}/${esc((data.totals && data.totals.tokens_out) || data.tokens_out || 0)}</span>
    </div>
    ${data.error ? `<div class="err">${esc(data.error)}</div>` : ""}
  </section>`;

  const sys = data.system_prompts || [];
  if (sys.length) {
    html += `<details class="sysbox card"><summary style="display:block;padding:4px 0;min-height:var(--tap);cursor:pointer">系统提示（${sys.length}）</summary>`;
    sys.forEach((s,i) => { html += clipView(s, "sys-"+i); });
    html += `</details>`;
  }

  for (const turn of (data.turns || [])) {
    if (q) {
      const bag = JSON.stringify(turn).toLowerCase();
      if (!bag.includes(q) && !JSON.stringify(turn.user_prompts||[]).toLowerCase().includes(q)) {
        /* still show turn header if any step matches - checked below */
      }
    }
    const steps = turn.steps || [];
    const shown = q ? steps.filter(st => JSON.stringify(st).toLowerCase().includes(q)) : steps;
    if (q && !shown.length && !(JSON.stringify(turn.user_prompts||[]).toLowerCase().includes(q))) continue;
    html += `<div class="turnh">回合 ${esc(turn.turn)} · ${esc(turn.start || "")} → ${esc(turn.end || "进行中")} · ${esc(turn.elapsed_s != null ? turn.elapsed_s+"s" : "")} · ${esc(turn.finish || "")}</div>`;
    if (turn.error) html += `<div class="err">结束原因：${esc(turn.error)}</div>`;
    for (const up of (turn.user_prompts || [])) {
      html += `<section class="card"><h3 style="margin:0 0 6px;color:var(--mut);font-size:15px">用户输入</h3>${clipView(up, "u-"+turn.turn)}</section>`;
    }
    const openAt = (() => {
      const arr = q ? shown : steps;
      const i = arr.findIndex(st => (st.thinking && st.thinking.length) || (st.thinking_obj && st.thinking_obj.text));
      return i < 0 ? 0 : i;
    })();
    (q ? shown : steps).forEach((st, i) => { html += renderStep(st, st.step ?? i, data.short_id || "s", i === openAt); });
  }

  if (data.comms && data.comms.length) {
    html += `<section class="card"><h2>comms</h2>` + data.comms.map(c =>
      `<div class="meta">${esc(c.at)} · ${esc(c.type)} · ${esc(c.from)} → ${esc(c.to)}</div><div>${esc(typeof c.summary==="string"?c.summary:JSON.stringify(c.summary))}</div>`
    ).join("") + `</section>`;
  }
  if (data.outputs && data.outputs.length) {
    html += `<section class="card"><h2>产物</h2>` + data.outputs.map(o =>
      `<div class="meta mono">${esc(o.path)} · ${esc(o.bytes)} B · ${esc(o.mtime)}</div>`
    ).join("") + `</section>`;
  }
  return html || `<div class="empty">这个任务还没有步骤记录。</div>`;
}

function renderAutoloop(data) {
  let html = `<section class="card"><h2>Autoloop</h2><div class="meta">来自本地 hub.db 只读导出，不含密钥。</div></section>`;
  for (const r of (data.runs || [])) {
    html += `<article class="step open"><button class="head" type="button"><span class="n">#${esc(r.id)} ${esc(r.rule||"")} ${statusPill(r.state)}</span><span class="t">${esc(r.created||r.created_at||"")}</span></button>
      <div class="body">
        <div class="meta">${esc([r.agent, r.lane, r.summary].filter(Boolean).join(" · "))}</div>
        ${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}
        ${(r.events||[]).map(e => `<div class="block"><div class="meta">${esc(e.received_at||e.time||"")} · ${esc(e.type)}</div><div>${esc(e.subject||"")}</div><div class="meta">${esc(e.summary||"")}</div></div>`).join("")}
      </div></article>`;
  }
  if (data.cards && data.cards.length) {
    html += `<div class="turnh">卡片</div>`;
    for (const c of data.cards) {
      html += `<section class="card"><div class="t-title">${esc(c.title||("卡片 "+c.id))} ${statusPill(c.state)}</div>
        <div class="meta">${esc(c.created_at||"")} · ${esc(c.rule||"")}</div>
        <div class="msg">${esc(c.text||"")}</div>
        ${c.choice ? `<div class="meta">选择：${esc(c.choice)}</div>` : ""}</section>`;
    }
  }
  if (data.worker_runs && data.worker_runs.length) {
    html += `<div class="turnh">Worker 运行</div>`;
    for (const w of data.worker_runs) {
      html += `<article class="step"><button class="head" type="button"><span class="n">${esc(w.id)}</span><span class="t">exit ${esc(w.exit ?? "?")}</span></button>
        <div class="body">${clipView(w.command, "cmd-"+w.id)}
        ${w.stdout ? `<div class="block"><h3>stdout</h3>${clipView(w.stdout, "so-"+w.id)}</div>` : ""}
        ${w.stderr ? `<div class="block"><h3>stderr</h3>${clipView(w.stderr, "se-"+w.id)}</div>` : ""}</div></article>`;
    }
  }
  return html;
}

async function openTask(id) {
  if (!id) {
    currentId = null;
    location.hash = "";
    document.getElementById("hdrTitle").textContent = "dsh 监控";
    document.getElementById("detail").classList.add("hidden");
    document.getElementById("detailPlaceholder").classList.remove("hidden");
    document.getElementById("switcher").value = "";
    applyLayout();
    return;
  }
  currentId = id;
  location.hash = "#/" + id;
  const t = (manifest.tasks || []).find(x => x.id === id);
  document.getElementById("hdrTitle").textContent = (t && (t.title || t.short_id)) || (id === "autoloop" ? "Autoloop" : id);
  document.getElementById("switcher").value = id;
  const detail = document.getElementById("detail");
  document.getElementById("detailPlaceholder").classList.add("hidden");
  detail.classList.remove("hidden");
  detail.innerHTML = `<div class="empty">正在加载…</div>`;
  applyLayout();
  try {
    const data = await loadChunk(id);
    detail.innerHTML = id === "autoloop" ? renderAutoloop(data) : renderSession(data);
    requestAnimationFrame(() => {
      const first = detail.querySelector("article.step.open") || detail.querySelector("article.step");
      if (!first) return;
      const pane = document.getElementById("detailcol");
      const desk = window.matchMedia("(min-width:900px)").matches;
      if (desk && pane) {
        const top = first.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop - 8;
        pane.scrollTop = Math.max(0, top);
      } else {
        first.scrollIntoView({block:"start", inline:"nearest"});
      }
    });
  } catch (e) {
    detail.innerHTML = `<div class="empty">无法加载这个任务的明细。</div>`;
  }
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("p").value;
  try { await unlock(pw); }
  catch (err) {
    document.getElementById("p").value = "";
    // Wrong password: show nothing, leave the form up so the user can retry.
  }
});
document.getElementById("list").addEventListener("click", (e) => {
  const btn = e.target.closest("button.card");
  if (btn && btn.dataset.id) openTask(btn.dataset.id);
});
document.getElementById("backBtn").addEventListener("click", () => openTask(null));
document.getElementById("switcher").addEventListener("change", (e) => openTask(e.target.value || null));
document.getElementById("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});
document.getElementById("q").addEventListener("input", (e) => {
  query = e.target.value.trim();
  renderList();
  if (currentId) openTask(currentId);
});
document.body.addEventListener("click", (e) => {
  const head = e.target.closest(".step > button.head");
  if (head) { head.parentElement.classList.toggle("open"); return; }
  const more = e.target.closest("[data-more]");
  if (more) {
    const pre = document.getElementById(more.dataset.more);
    if (pre) {
      pre.textContent = (pre.textContent || "") + decodeURIComponent(more.dataset.extra || "");
      more.remove();
    }
  }
});
window.addEventListener("resize", applyLayout);
window.addEventListener("hashchange", () => {
  if (!manifest) return;
  const id = (location.hash || "").replace(/^#\/?/, "") || null;
  if (id !== currentId) openTask(id);
});

// Auto-unlock from this browsing session only.
(async () => {
  let pw = "";
  try { pw = sessionStorage.getItem(SSKEY) || ""; } catch (e) {}
  if (pw) {
    try { await unlock(pw); return; } catch (e) {
      try { sessionStorage.removeItem(SSKEY); } catch (e2) {}
    }
  }
})();

// live-ish: re-fetch manifest every 5 minutes; same key, no new prompt
setInterval(async () => {
  if (!key || !sessionStorage.getItem(SSKEY)) return;
  try {
    const resp = await fetch("data/manifest.enc.json?t=" + Date.now(), {cache:"no-store"});
    if (!resp.ok) return;
    const blob = await resp.json();
    const next = await decBlob(blob, key);
    manifest = next;
    renderChrome();
    if (!currentId) renderList();
  } catch (e) { /* keep current view */ }
}, 5 * 60 * 1000);
</script>
