const ITERS = 210000;
function b64(s) {
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function derive(pw, salt) {
  const enc = new TextEncoder();
  const mat = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name: "PBKDF2", salt, iterations: ITERS, hash: "SHA-256"},
    mat, {name: "AES-GCM", length: 256}, false, ["decrypt"]
  );
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("p").value;
  const raw = b64(PAYLOAD);
  const salt = raw.slice(0, 16);
  const iv = raw.slice(16, 28);
  const ct = raw.slice(28);
  // Wrong password: show nothing. Do not render ciphertext, do not explain the failure.
  try {
    const key = await derive(pw, salt);
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, ct);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (err) {
    document.getElementById("p").value = "";
    document.getElementById("out").replaceChildren();
  }
});
